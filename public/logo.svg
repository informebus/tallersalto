<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <rect width="500" height="500" rx="40" fill="#0d4e83"/>
  <g fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Decorative Laurel Wreath Left -->
    <path d="M 120 280 C 100 220 110 160 145 110" stroke-width="5"/>
    <path d="M 145 110 C 130 90 120 70 122 55 C 135 65 142 85 145 110" fill="#ffffff"/>
    <path d="M 135 140 C 115 125 100 120 95 128 C 105 140 120 145 135 140" fill="#ffffff"/>
    <path d="M 125 180 C 100 170 85 170 82 180 C 95 190 112 190 125 180" fill="#ffffff"/>
    <path d="M 118 225 C 92 220 80 225 78 238 C 92 245 108 240 118 225" fill="#ffffff"/>
    <path d="M 115 275 C 90 280 80 290 82 302 C 98 302 110 292 115 275" fill="#ffffff"/>
    <path d="M 122 325 C 102 340 98 355 105 365 C 118 360 125 345 122 325" fill="#ffffff"/>
    <path d="M 140 375 C 125 395 128 410 138 418 C 148 408 148 392 140 375" fill="#ffffff"/>

    <!-- Outer Decorative Oak Leaves Right -->
    <path d="M 380 280 C 400 220 390 160 355 110" stroke-width="5"/>
    <path d="M 355 110 C 370 90 380 70 378 55 C 365 65 358 85 355 110" fill="#ffffff"/>
    <path d="M 365 140 C 385 125 400 120 405 128 C 395 140 380 145 365 140" fill="#ffffff"/>
    <path d="M 375 180 C 400 170 415 170 418 180 C 405 190 388 190 375 180" fill="#ffffff"/>
    <path d="M 382 225 C 408 220 420 225 422 238 C 408 245 392 240 382 225" fill="#ffffff"/>
    <path d="M 385 275 C 410 280 420 290 418 302 C 402 302 390 292 385 275" fill="#ffffff"/>
    <path d="M 378 325 C 398 340 402 355 395 365 C 382 360 375 345 378 325" fill="#ffffff"/>
    <path d="M 360 375 C 375 395 372 410 362 418 C 352 408 352 392 360 375" fill="#ffffff"/>

    <!-- Bottom Ribbon Bow -->
    <path d="M 220 415 C 235 400 265 400 280 415 C 265 430 235 430 220 415" fill="#ffffff"/>
    <path d="M 200 410 C 170 400 160 435 195 445 C 215 440 225 425 220 415" stroke-width="3" fill="#ffffff" fill-opacity="0.2"/>
    <path d="M 300 410 C 330 400 340 435 305 445 C 285 440 275 425 280 415" stroke-width="3" fill="#ffffff" fill-opacity="0.2"/>
    <path d="M 215 435 C 190 460 170 480 185 490 C 205 480 225 455 225 440" fill="#ffffff"/>
    <path d="M 285 435 C 310 460 330 480 315 490 C 295 480 275 455 275 440" fill="#ffffff"/>

    <!-- Main Oval Crest Frame -->
    <ellipse cx="250" cy="245" rx="115" ry="155" stroke-width="7"/>
    <ellipse cx="250" cy="245" rx="108" ry="148" stroke-width="2"/>

    <!-- Top Banner Ribbon SALTO -->
    <path d="M 175 95 Q 250 55 325 95 L 345 75 Q 250 30 155 75 Z" fill="#ffffff"/>
    <path d="M 155 75 L 140 60 L 145 95 L 175 95" fill="#ffffff"/>
    <path d="M 345 75 L 360 60 L 355 95 L 325 95" fill="#ffffff"/>
  </g>

  <!-- SALTO Text on Banner -->
  <text x="250" y="77" font-family="'Plus Jakarta Sans', 'Times New Roman', serif" font-weight="900" font-size="28" fill="#0d4e83" text-anchor="middle" letter-spacing="4">SALTO</text>

  <!-- Internal Shield Divisions -->
  <g stroke="#ffffff" stroke-width="4" fill="none">
    <!-- Horizontal Divider -->
    <line x1="140" y1="245" x2="360" y2="245" stroke-width="6"/>
    <!-- Vertical Divider for top half -->
    <line x1="245" y1="95" x2="245" y2="245" stroke-width="5"/>

    <!-- Top Left: Sun rays and Anvil (Sol Naciente y Yunque) -->
    <!-- Sun Rays -->
    <line x1="190" y1="210" x2="160" y2="120" stroke-width="4"/>
    <line x1="190" y1="210" x2="190" y2="105" stroke-width="4"/>
    <line x1="190" y1="210" x2="225" y2="115" stroke-width="4"/>
    <line x1="190" y1="210" x2="145" y2="155" stroke-width="4"/>
    <line x1="190" y1="210" x2="145" y2="195" stroke-width="4"/>
    <path d="M 160 215 C 160 190 220 190 220 215 Z" fill="#ffffff"/>
    <!-- Anvil & Hammer -->
    <path d="M 165 210 L 220 210 L 210 225 L 225 228 L 225 238 L 155 238 L 155 228 L 175 225 Z" fill="#ffffff"/>

    <!-- Top Right: Minerva / Athena (Diosa de la Sabiduría) -->
    <g transform="translate(260, 115) scale(0.65)" fill="#ffffff" stroke="none">
      <!-- Head and Helmet -->
      <circle cx="40" cy="20" r="10"/>
      <path d="M 32 12 Q 40 0 48 12 Q 52 20 40 22 Z"/>
      <!-- Body & Robe -->
      <path d="M 28 32 L 52 32 L 60 120 L 20 120 Z"/>
      <!-- Bird on hand / Arm -->
      <path d="M 28 45 L 8 40 L 4 50 L 22 55 Z"/>
      <path d="M 4 35 C 0 35 -4 42 2 45 C 8 45 10 38 4 35 Z"/>
      <!-- Pedestal / Cloud base -->
      <ellipse cx="40" cy="125" rx="35" ry="10"/>
    </g>

    <!-- Bottom Half: Salto Grande Waterfalls & Waves -->
    <!-- Water Cascade Edge -->
    <path d="M 148 275 Q 230 270 352 275" stroke-width="4"/>
    <path d="M 152 290 Q 240 285 348 290" stroke-width="3"/>
    
    <!-- Waterfall Drop Lines -->
    <path d="M 210 290 L 205 340" stroke-width="3"/>
    <path d="M 230 290 L 225 345" stroke-width="3"/>
    <path d="M 250 290 L 250 350" stroke-width="4"/>
    <path d="M 270 290 L 275 345" stroke-width="3"/>
    <path d="M 290 290 L 295 340" stroke-width="3"/>
    <path d="M 310 290 L 320 335" stroke-width="3"/>

    <!-- Water foam & rapids -->
    <path d="M 170 340 Q 200 325 240 345 Q 280 325 330 345" stroke-width="4"/>
    <path d="M 160 365 Q 210 355 260 370 Q 300 355 340 365" stroke-width="3"/>
    <path d="M 180 385 Q 250 375 320 385" stroke-width="3"/>
  </g>
</svg>
